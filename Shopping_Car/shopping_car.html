<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopping Cart Checkpoint</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- FontAwesome Icons CDN -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark mb-5">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Mon Panier Shopping</span>
      </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
      <h2 class="mb-4 text-center">Articles Sélectionnés</h2>

      <div class="row justify-content-center">
        <div class="col-md-8">
          <!-- Total Price Section -->
          <div class="card p-3 bg-white mb-4 shadow-sm border-0">
            <div class="d-flex justify-content-between align-items-center">
              <h3 class="m-0">Total Price:</h3>
              <h3 class="total-price m-0 text-success fw-bold">$ 0</h3>
            </div>
          </div>

          <!-- List of Products -->
          <div class="list-products">
            <!-- Product 1 -->
            <div class="card mb-3 p-3 shadow-sm border-0">
              <div class="row g-0 align-items-center">
                <div class="col-md-3 text-center">
                  <img
                    src="https://via.placeholder.com/100"
                    class="img-fluid rounded"
                    alt="Produit 1"
                  />
                </div>
                <div class="col-md-5">
                  <div class="card-body">
                    <h5 class="card-title">Basket Sport</h5>
                    <p class="card-text text-muted">Chaussure confortable</p>
                    <h4 class="unit-price text-dark">$ 100</h4>
                  </div>
                </div>
                <div class="col-md-4 text-end">
                  <div class="quantity-control mb-2">
                    <i
                      class="fas fa-plus-circle text-success fs-4"
                      style="cursor: pointer"
                    ></i>
                    <span class="quantity mx-3 fs-5 fw-bold">0</span>
                    <i
                      class="fas fa-minus-circle text-warning fs-4"
                      style="cursor: pointer"
                    ></i>
                  </div>
                  <div class="actions">
                    <i
                      class="fas fa-trash-alt text-danger fs-5 me-3"
                      style="cursor: pointer"
                      title="Supprimer"
                    ></i>
                    <i
                      class="fas fa-heart text-secondary fs-5"
                      style="cursor: pointer"
                      title="J'aime"
                    ></i>
                  </div>
                </div>
              </div>
            </div>

            <!-- Product 2 -->
            <div class="card mb-3 p-3 shadow-sm border-0">
              <div class="row g-0 align-items-center">
                <div class="col-md-3 text-center">
                  <img
                    src="https://via.placeholder.com/100"
                    class="img-fluid rounded"
                    alt="Produit 2"
                  />
                </div>
                <div class="col-md-5">
                  <div class="card-body">
                    <h5 class="card-title">Montre Connectée</h5>
                    <p class="card-text text-muted">Smartwatch moderne</p>
                    <h4 class="unit-price text-dark">$ 150</h4>
                  </div>
                </div>
                <div class="col-md-4 text-end">
                  <div class="quantity-control mb-2">
                    <i
                      class="fas fa-plus-circle text-success fs-4"
                      style="cursor: pointer"
                    ></i>
                    <span class="quantity mx-3 fs-5 fw-bold">0</span>
                    <i
                      class="fas fa-minus-circle text-warning fs-4"
                      style="cursor: pointer"
                    ></i>
                  </div>
                  <div class="actions">
                    <i
                      class="fas fa-trash-alt text-danger fs-5 me-3"
                      style="cursor: pointer"
                      title="Supprimer"
                    ></i>
                    <i
                      class="fas fa-heart text-secondary fs-5"
                      style="cursor: pointer"
                      title="J'aime"
                    ></i>
                  </div>
                </div>
              </div>
            </div>

            <!-- Product 3 -->
            <div class="card mb-3 p-3 shadow-sm border-0">
              <div class="row g-0 align-items-center">
                <div class="col-md-3 text-center">
                  <img
                    src="https://via.placeholder.com/100"
                    class="img-fluid rounded"
                    alt="Produit 3"
                  />
                </div>
                <div class="col-md-5">
                  <div class="card-body">
                    <h5 class="card-title">Casque Audio</h5>
                    <p class="card-text text-muted">Wireless headphones</p>
                    <h4 class="unit-price text-dark">$ 80</h4>
                  </div>
                </div>
                <div class="col-md-4 text-end">
                  <div class="quantity-control mb-2">
                    <i
                      class="fas fa-plus-circle text-success fs-4"
                      style="cursor: pointer"
                    ></i>
                    <span class="quantity mx-3 fs-5 fw-bold">0</span>
                    <i
                      class="fas fa-minus-circle text-warning fs-4"
                      style="cursor: pointer"
                    ></i>
                  </div>
                  <div class="actions">
                    <i
                      class="fas fa-trash-alt text-danger fs-5 me-3"
                      style="cursor: pointer"
                      title="Supprimer"
                    ></i>
                    <i
                      class="fas fa-heart text-secondary fs-5"
                      style="cursor: pointer"
                      title="J'aime"
                    ></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript File Linking -->
    <script src="shopping_car.js"></script>
  </body>
</html>
